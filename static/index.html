<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041207">
<meta name="format-detection" content="telephone=no">
<title>Beacon — Offline Emergency Assistant</title>
<style>
:root{
  --bg:#041207;
  --line:rgba(158,213,178,.20);
  --line-strong:rgba(158,213,178,.42);
  --green:#4ade80;
  --green-soft:#bbf7d0;
  --green-tint:rgba(74,222,128,.07);
  --red:#ef4444;
  --red-tint:rgba(239,68,68,.12);
  --text:#f0fdf4;
  --muted:rgba(220,252,231,.68);
  --faint:rgba(220,252,231,.55);
  --ink-on-green:#052e16;
  --r-card:12px;
  --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(130% 50% at 50% -10%, rgba(12,54,28,.75) 0%, rgba(12,54,28,0) 62%);
  background-repeat:no-repeat;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-kerning:normal;
  line-height:1.5;
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;pointer-events:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}

header{padding-bottom:20px;border-bottom:1px solid var(--line)}
header h1{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;line-height:1}
header h1 .mark{flex:0 0 auto;color:var(--green)}
.subtitle{margin-top:8px;font-size:15px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--green-tint);font-size:12px;font-weight:600;color:var(--green-soft);font-variant-numeric:tabular-nums}
.chip-live{text-transform:uppercase;letter-spacing:.07em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.briefed{margin-top:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.langs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:20px;margin-inline:-2px;padding:4px 2px 8px;scrollbar-width:thin;scrollbar-color:rgba(158,213,178,.35) transparent}
.langs::-webkit-scrollbar{height:4px}
.langs::-webkit-scrollbar-track{background:transparent}
.langs::-webkit-scrollbar-thumb{background:rgba(158,213,178,.3);border-radius:2px}
.lang{flex:0 0 auto;min-height:44px;padding:0 16px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:15px;font-weight:600;color:var(--text)}
.lang.sel{background:var(--green);border-color:var(--green);color:var(--ink-on-green);font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.panic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:98px;padding:14px 10px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--green-tint);font-size:15px;font-weight:600;line-height:1.3;text-align:center}
.panic .ico{font-size:26px;line-height:1}
.panic:active{transform:scale(.98);background:rgba(74,222,128,.15)}
.panic.danger{background:var(--red-tint);border-color:rgba(239,68,68,.5)}
.panic.danger:active{background:rgba(239,68,68,.22)}
.panic.sel{border-color:var(--green);background:rgba(74,222,128,.15)}
.panic.danger.sel{border-color:var(--red);background:rgba(239,68,68,.2)}
.panic.wide{grid-column:1/-1;flex-direction:row;min-height:56px;gap:10px;text-decoration:none;color:inherit}
.panic.wide .ico{font-size:20px}
.subs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.subs:not([hidden]){animation:reveal .18s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(-3px)}}
.subhint{width:100%;font-size:13px;color:var(--muted);margin-bottom:2px}
.sub{min-height:44px;padding:10px 16px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:rgba(74,222,128,.08);font-size:15px;font-weight:600;color:var(--green-soft);text-align:start}
.sub:active{transform:scale(.98);background:rgba(74,222,128,.18)}

.askrow{display:flex;gap:10px;margin-top:16px}
#q{flex:1;min-width:0;height:56px;padding:0 16px;font-family:inherit;font-size:16px;color:var(--text);background:rgba(240,253,244,.05);border:1px solid var(--line);border-radius:var(--r-card);outline:none;-webkit-appearance:none;appearance:none}
#q:focus{border-color:rgba(74,222,128,.55)}
#q:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#q::placeholder{color:var(--muted)}
#send{height:56px;padding:0 20px;background:var(--green);color:var(--ink-on-green);font-size:16px;font-weight:700;border-radius:var(--r-card);white-space:nowrap}
#send:active{transform:scale(.98)}

.answerwrap{margin-top:24px}
.queue{padding:14px 16px;border:1px solid var(--line-strong);border-radius:var(--r-card);background:var(--green-tint);font-size:15px;color:var(--green-soft);margin-bottom:12px;font-variant-numeric:tabular-nums}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.card{padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--green-tint);font-size:13px;color:var(--green-soft)}
.asked{margin-bottom:10px;font-size:13px;color:var(--muted)}
.answer{border:1px solid var(--line);border-radius:var(--r-card);padding:20px 18px;background:rgba(240,253,244,.03);font-size:17.5px;line-height:1.65;overflow-wrap:break-word;word-wrap:break-word}
.answer>:first-child{margin-top:0}
.answer>:last-child{margin-bottom:0}
.answer p{margin:12px 0}
.answer h3{margin:20px 0 8px;font-size:19px;font-weight:700;line-height:1.35;color:var(--green-soft)}
.answer h4{margin:16px 0 6px;font-size:17.5px;font-weight:700;line-height:1.35;color:var(--green-soft)}
.answer ol,.answer ul{margin:12px 0;padding-inline-start:22px}
.answer li{margin:8px 0}
.answer li::marker{color:var(--green)}
.answer strong{font-weight:700;color:var(--green-soft)}
.cursor{display:inline-block;color:var(--green);font-weight:400;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.err{color:#fecaca}

footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
.assure{display:inline-block;padding:8px 16px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--green-soft);font-variant-numeric:tabular-nums}
.assure strong{color:var(--green);font-weight:700}
footer .note{margin-top:10px}
footer .tiny{margin-top:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

@media (prefers-reduced-motion:reduce){.dot,.cursor,.subs{animation:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><svg class="mark" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true" focusable="false"><circle cx="12" cy="16.4" r="2.2" fill="currentColor"/><path d="M7.8 11.9a5.9 5.9 0 0 1 8.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.9 8.6a10 10 0 0 1 14.2 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Beacon</h1>
  <p class="subtitle" id="subtitle">Offline Emergency Assistant</p>
  <div class="chips">
    <span class="chip chip-live"><span class="dot"></span>OFFLINE — SERVING LOCALLY</span>
    <span class="chip" id="chip-model" hidden></span>
    <span class="chip" id="chip-clients" hidden></span>
  </div>
  <p class="briefed" id="briefed" hidden></p>
</header>

<main>
  <nav class="langs" id="langs" aria-label="Language">
    <button type="button" class="lang sel" data-lang="en">EN</button>
    <button type="button" class="lang" data-lang="es">ES</button>
    <button type="button" class="lang" data-lang="fr">FR</button>
    <button type="button" class="lang" data-lang="ar">AR</button>
    <button type="button" class="lang" data-lang="zh">中文</button>
    <button type="button" class="lang" data-lang="pl">PL</button>
    <button type="button" class="lang" data-lang="ro">RO</button>
    <button type="button" class="lang" data-lang="pt">PT</button>
    <button type="button" class="lang" data-lang="tr">TR</button>
    <button type="button" class="lang" data-lang="bn">বাংলা</button>
    <button type="button" class="lang" data-lang="ur">اردو</button>
  </nav>

  <section class="grid" id="grid">
    <button type="button" class="panic danger" data-key="medical" aria-label="Medical emergency"><span class="ico">🚑</span><span class="lbl">Medical emergency</span></button>
    <button type="button" class="panic" data-key="firstaid" aria-label="First aid"><span class="ico">🩹</span><span class="lbl">First aid</span></button>
    <button type="button" class="panic" data-key="water" aria-label="Safe water"><span class="ico">💧</span><span class="lbl">Safe water</span></button>
    <button type="button" class="panic" data-key="power" aria-label="Power cut"><span class="ico">🔌</span><span class="lbl">Power cut</span></button>
    <button type="button" class="panic" data-key="warm" aria-label="Stay warm"><span class="ico">🥶</span><span class="lbl">Stay warm</span></button>
    <button type="button" class="panic" data-key="help" aria-label="Find help nearby"><span class="ico">🏥</span><span class="lbl">Find help nearby</span></button>
    <a class="panic wide" href="/map" aria-label="Offline map — find nearest A&amp;E"><span class="ico">🗺</span><span class="lbl">Map — nearest A&amp;E</span></a>
  </section>

  <div class="subs" id="subs" hidden></div>

  <form class="askrow" id="askform" autocomplete="off">
    <input id="q" type="text" dir="auto" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Type your question…">
    <button type="submit" id="send">Ask Beacon</button>
  </form>

  <section class="answerwrap" id="answerwrap" hidden>
    <div class="queue" id="queue" hidden></div>
    <p class="asked" id="asked"></p>
    <div class="cards" id="cards" hidden></div>
    <div class="answer" id="answer" aria-live="polite"></div>
  </section>
</main>

<footer>
  <p class="assure">Bytes sent to the internet:&nbsp;<strong>0</strong></p>
  <p class="note">Everything runs on this laptop</p>
  <p class="tiny">Blackout Beacon — Gemma 4 on-device</p>
</footer>

<noscript><p style="margin-top:16px;color:#fecaca">Beacon needs JavaScript enabled.</p></noscript>
</div>

  var CURSOR = '<span class="cursor">▍</span>';
  var state = { lang: 'en', busy: false, es: null, raw: '', done: true };

  function $(id) { return document.getElementById(id); }
  function t() { return I18N[state.lang] || I18N.en; }
  function safeParse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---- markdown-lite: **bold**, # headers, numbered + bulleted lists ---- */
  function inlineMd(s) {
    return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function renderMd(src) {
    var lines = escapeHtml(src).split(/\r?\n/);
    var out = [], list = null, i, s, m;
    function closeList() { if (list) { out.push('</' + list + '>'); list = null; } }
    for (i = 0; i < lines.length; i++) {
      s = lines[i].replace(/^\s+/, '').replace(/\s+$/, '');
      if (!s) { closeList(); continue; }
      m = s.match(/^(#{1,3})\s+(.*)$/);
      if (m) {
        closeList();
        out.push(m[1].length === 1 ? '<h3>' + inlineMd(m[2]) + '</h3>' : '<h4>' + inlineMd(m[2]) + '</h4>');
        continue;
      }
      m = s.match(/^(\d+)[.)]\s+(.*)$/);
      if (m) {
        if (list !== 'ol') { closeList(); out.push('<ol start="' + m[1] + '">'); list = 'ol'; }
        out.push('<li>' + inlineMd(m[2]) + '</li>');
        continue;
      }
      m = s.match(/^[-*•]\s+(.*)$/);
      if (m) {
        if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + inlineMd(m[1]) + '</li>');
        continue;
      }
      closeList();
      out.push('<p>' + inlineMd(s) + '</p>');
    }
    closeList();
    return out.join('');
  }

  /* ---- rendering helpers ---- */
  function nearBottom() {
    var doc = document.documentElement;
    var y = window.pageYOffset || doc.scrollTop || 0;
    return y + window.innerHeight >= doc.scrollHeight - 220;
  }
  function paint(cursor) {
    $('answer').innerHTML = (state.raw ? renderMd(state.raw) : '') + (cursor ? CURSOR : '');
    if (cursor && nearBottom()) {
      window.scrollTo(0, document.documentElement.scrollHeight);
    }
  }
  function setBusy(b) {
    state.busy = b;
    var btns = document.querySelectorAll('.panic');
    for (var i = 0; i < btns.length; i++) { btns[i].disabled = b; }
    $('q').disabled = b;
    $('send').disabled = b;
  }
  function showQueue(n) {
    $('queue').textContent = '⏳ ' + t().queue.replace('{n}', String(n));
    $('queue').hidden = false;
  }

  /* ---- ask via SSE ---- */
  function finish(err) {
    state.done = true;
    if (state.es) { try { state.es.close(); } catch (e) {} state.es = null; }
    $('queue').hidden = true;
    if (err) {
      $('answer').innerHTML = (state.raw ? renderMd(state.raw) : '') +
        '<p class="err">⚠️ ' + escapeHtml(err) + '</p>';
    } else if (state.raw) {
      paint(false);
    } else {
      $('answer').innerHTML = '<p class="err">' + escapeHtml(t().error) + '</p>';
    }
    setBusy(false);
  }

  function ask(q) {
    if (state.busy || !q) { return; }
    if (!window.EventSource) {
      $('answerwrap').hidden = false;
      $('answer').innerHTML = '<p class="err">' + escapeHtml(t().error) + '</p>';
      return;
    }
    state.raw = '';
    state.done = false;
    setBusy(true);

    $('answerwrap').hidden = false;
    $('queue').hidden = true;
    var cardsEl = $('cards');
    cardsEl.hidden = true;
    cardsEl.innerHTML = '';
    $('asked').textContent = q;
    paint(true);
    try { $('q').blur(); } catch (e0) {}
    try { $('answerwrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e1) {}

    var es = new EventSource('/api/ask?q=' + encodeURIComponent(q) + '&lang=' + encodeURIComponent(state.lang));
    state.es = es;

    es.addEventListener('queued', function (e) {
      var d = safeParse(e.data);
      if (d && d.position != null) { showQueue(d.position); }
    });

    es.addEventListener('start', function (e) {
      $('queue').hidden = true;
      var d = safeParse(e.data);
      if (d && d.cards && d.cards.length) {
        var html = '';
        for (var i = 0; i < d.cards.length; i++) {
          html += '<span class="card">📋 ' + escapeHtml(d.cards[i].title || '') + '</span>';
        }
        cardsEl.innerHTML = html;
        cardsEl.hidden = false;
      }
    });

    es.addEventListener('token', function (e) {
      var d = safeParse(e.data);
      if (d && d.text) {
        if (!$('queue').hidden) { $('queue').hidden = true; }
        state.raw += d.text;
        paint(true);
      }
    });

    es.addEventListener('done', function () {
      if (!state.done) { finish(null); }
    });

    /* Catches both server-sent `event: error` (has e.data) and transport
       failures (no data). Either way: stop, close, never auto-reconnect. */
    es.addEventListener('error', function (e) {
      if (state.done) { return; }
      var d = (e && typeof e.data === 'string') ? safeParse(e.data) : null;
      finish((d && d.message) ? d.message : t().error);
    });
  }

  function setLang(code) {
    if (!I18N[code]) { code = 'en'; }
    state.lang = code;
    try { localStorage.setItem('beacon_lang', code); } catch (e) {}
    document.documentElement.lang = code;

    var pills = document.querySelectorAll('.lang');
    for (var i = 0; i < pills.length; i++) {
      pills[i].className = (pills[i].getAttribute('data-lang') === code) ? 'lang sel' : 'lang';
    }
    var tr = t();
    $('subtitle').textContent = tr.subtitle;
    $('q').setAttribute('placeholder', tr.placeholder);
    $('send').textContent = tr.ask;
    var btns = document.querySelectorAll('.panic');
    for (var j = 0; j < btns.length; j++) {
      var key = btns[j].getAttribute('data-key');
      if (tr.b[key]) { btns[j].querySelector('.lbl').textContent = tr.b[key][0]; btns[j].setAttribute('aria-label', tr.b[key][0]); }
    }
    $('answerwrap').setAttribute('dir', (code === 'ar' || code === 'ur') ? 'rtl' : 'ltr');
    $('subs').setAttribute('dir', (code === 'ar' || code === 'ur') ? 'rtl' : 'ltr');
    if (typeof renderBranch === 'function') { renderBranch(); }

  function fmtClients(n) {
    return n === 1 ? '1 phone connected' : String(n) + ' phones connected';
  }
  function poll() {
    fetch('/api/status', { cache: 'no-store' }).then(function (r) {
      return r.json();
    }).then(function (s) {
      if (!s) { return; }
      if (s.model) {
        $('chip-model').textContent = s.model;
        $('chip-model').hidden = false;
      }
      if (typeof s.clients === 'number') {
        $('chip-clients').textContent = fmtClients(s.clients);
        $('chip-clients').hidden = false;
      }
      var parts = [];
      if (s.briefed_at) {
        var bd = new Date(s.briefed_at);
        var btxt = isNaN(bd) ? s.briefed_at
          : bd.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ', ' +
            bd.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        parts.push('Briefed ' + btxt);
      }
      if (s.location) { parts.push(s.location); }
      if (parts.length) {
        $('briefed').textContent = parts.join(' · ');
        $('briefed').hidden = false;
      } else {
        $('briefed').hidden = true;
      }
    })['catch'](function () { /* keep last known chips */ });
  }

    var hint = document.createElement('div');
    hint.className = 'subhint';
    hint.textContent = pack.hint || SUBS.en.hint;
    subs.appendChild(hint);
    for (var n = 0; n < list.length; n++) {
      (function (item) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'sub';
        b.textContent = item[0];
        b.addEventListener('click', function () {
          if (!state.busy) { state.branch = null; renderBranch(); ask(item[1]); }
        });
        subs.appendChild(b);
      })(list[n]);
    }
    subs.hidden = false;
  }

  var panics = document.querySelectorAll('.panic');
  for (var j = 0; j < panics.length; j++) {
    panics[j].addEventListener('click', function () {
      if (state.busy) { return; }
      var key = this.getAttribute('data-key');
      state.branch = (state.branch === key) ? null : key;  // tap again to close
      renderBranch();
      if (state.branch) { $('q').focus(); }
    });
  }
  $('askform').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q').value.replace(/^\s+|\s+$/g, '');
    if (q) { state.branch = null; renderBranch(); ask(q); }  // typing quietly overrides the branch
  });

  var saved = null;
  try { saved = localStorage.getItem('beacon_lang'); } catch (e) {}
  setLang(saved || 'en');

  poll();
  setInterval(poll, 10000);
})();
</script>
</body>
</html>
